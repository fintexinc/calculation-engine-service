# SM REST slice ITs: paths align with bootstrap application.yml (required for @Value on fetcher beans).
# base-url is overridden by @DynamicPropertySource (MockWebServer); placeholder for local/CI without SM_REST_BASE_URL.
external-services:
  security-master:
    api-type: rest
    rest:
      base-url: http://127.0.0.1:1
      timeout: 60000
      endpoints:
        attributes: /api/v1/wealth/securities/attributes
        reference:
          treasury-rates: /api/v1/wealth/reference/treasury-rates
