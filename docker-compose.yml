# TODO REMOVE WITH REDIS
services:
  redis:
    image: redis:7-alpine
    container_name: ce-redis
    command: redis-server --requirepass redis_pwd
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_pwd", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
