openapi: 3.0.1
info:
  title: Portfolio Calculation Engine API
  description: "Portfolio analytics and risk measurement engine. Calculates returns,\
    \ risk metrics, risk-adjusted ratios, portfolio composition, fees, and forecasts."
  contact:
    name: Digital Wealth Team
    email: kparamsothy@tangerine.ca
  license:
    name: Portfolio Calculation Engine
  version: 1.0.0
servers:
- url: /
  description: The host this document was served from
tags:
- name: Portfolio Calculations
  description: "Unified endpoint for all portfolio calculation metrics: returns, risk,\
    \ benchmark comparison, allocations, fees, and income"
- name: Actuator
  description: Monitor and interact
  externalDocs:
    description: Spring Boot Actuator Web API Documentation
    url: https://docs.spring.io/spring-boot/docs/current/actuator-api/html/
paths:
  /api/v1/portfolio/calculations:
    post:
      tags:
      - Portfolio Calculations
      summary: Execute several portfolio calculations in one request
      description: |
        Performs any combination of calculation metrics in a single request.

        Portfolio holdings, data providers and target currency are declared once at the top level and shared by every
        nested command; a nested command may still override them with its own values. Each command carries its 'metric'
        discriminator plus metric-specific parameters and may appear at most once. The Market Investment Catalogue attributes
        required by the requested metrics are fetched together in as few round trips as possible before the individual
        calculations run. Successful metrics are returned under 'results'; metrics whose calculation failed are returned
        under 'failures' with the corresponding notifications, so one failing metric does not discard the other results.
      operationId: calculateComposite
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompositeCalculationRequest"
        required: true
      responses:
        "200":
          description: Per-metric calculation results and failures
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompositeCalculationResult"
  /api/v1/portfolio/calculations/{metric-name}:
    post:
      tags:
      - Portfolio Calculations
      summary: Execute a portfolio calculation
      description: "Performs the specified calculation metric on the provided portfolio\
        \ holdings. The request body schema depends on the metric — period-based metrics\
        \ require time intervals, breakdown metrics require holdings, and fee metrics\
        \ require parameter types."
      operationId: calculate
      parameters:
      - name: metric-name
        in: path
        description: Calculation metric to execute
        required: true
        schema:
          type: string
          description: Available portfolio calculation metrics
          enum:
          - trailing-total-returns
          - annual-returns
          - growth-of-10k
          - standard-deviation
          - sharpe-ratio
          - max-drawdown
          - asset-allocations
          - asset-allocations-em
          - equity-sector
          - sector-exposure
          - equity-country-exposure
          - equity-geographic-exposure
          - geographic-exposure
          - fixed-income-country-exposure
          - fixed-income-geographic-exposure
          - fixed-income-bond-sector
          - mer
          - management-fee
          - fees
          - mer-benchmark-comparison
          - common-performance-dates
          - top-common-holdings
          - number-of-unique-holdings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculationCommand"
        required: true
      responses:
        "200":
          description: Calculation result
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/TrailingTotalReturnsResult"
                - $ref: "#/components/schemas/AnnualReturnResult"
                - $ref: "#/components/schemas/Growth10KResult"
                - $ref: "#/components/schemas/StandardDeviationResult"
                - $ref: "#/components/schemas/SharpeRatioResult"
                - $ref: "#/components/schemas/MaxDrawdownResult"
                - $ref: "#/components/schemas/AssetAllocationResult"
                - $ref: "#/components/schemas/AssetAllocationEMResult"
                - $ref: "#/components/schemas/EquitySectorResult"
                - $ref: "#/components/schemas/ConsolidatedSectorExposureResult"
                - $ref: "#/components/schemas/EquityCountryExposureResult"
                - $ref: "#/components/schemas/GeographicExposureResult"
                - $ref: "#/components/schemas/CountryExposureResult"
                - $ref: "#/components/schemas/FixedIncomeSectorResult"
                - $ref: "#/components/schemas/AverageMerResult"
                - $ref: "#/components/schemas/ManagementFeeResult"
                - $ref: "#/components/schemas/FeesResult"
                - $ref: "#/components/schemas/MerComparisonResult"
                - $ref: "#/components/schemas/CommonPerformanceDatesResult"
                - $ref: "#/components/schemas/TopCommonHoldingsResult"
                - $ref: "#/components/schemas/NumberOfUniqueHoldingsResult"
  /actuator/circuitbreakers/{name}:
    post:
      tags:
      - Actuator
      summary: Actuator web endpoint 'circuitbreakers-name'
      operationId: updateCircuitBreakerState
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: string
              enum:
              - CLOSE
              - FORCE_OPEN
              - DISABLE
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
  /actuator:
    get:
      tags:
      - Actuator
      summary: Actuator root web endpoint
      operationId: links
      responses:
        "200":
          description: OK
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/Link"
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/Link"
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/Link"
  /actuator/retries:
    get:
      tags:
      - Actuator
      summary: Actuator web endpoint 'retries'
      operationId: getAllRetries
      responses:
        "200":
          description: OK
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/json:
              schema:
                type: object
  /actuator/info:
    get:
      tags:
      - Actuator
      summary: Actuator web endpoint 'info'
      operationId: info
      responses:
        "200":
          description: OK
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/json:
              schema:
                type: object
  /actuator/health:
    get:
      tags:
      - Actuator
      summary: Actuator web endpoint 'health'
      operationId: health
      responses:
        "200":
          description: OK
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/json:
              schema:
                type: object
  /actuator/circuitbreakers:
    get:
      tags:
      - Actuator
      summary: Actuator web endpoint 'circuitbreakers'
      operationId: getAllCircuitBreakers
      responses:
        "200":
          description: OK
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/json:
              schema:
                type: object
  /actuator/calculation-stats:
    get:
      tags:
      - Actuator
      summary: Per-metric calculation statistics
      description: |
        Ranked statistics for every calculation metric that has been executed since the service started, plus an
        aggregate across all of them.

        Rows in `metrics` are ordered most-problematic first - by absolute failure count, then by failure ratio - so the
        head of the list is where to look. Per metric: execution counts split by outcome, `failureRatePercent`,
        calculation latency of successful runs (mean / max / p50 / p95 / p99, in milliseconds), the warning count
        distribution (total / min / mean / max), and the most frequent error and warning codes.

        A composite request is decomposed into its member metrics, so every row describes one metric regardless of which
        endpoint the client called. A request rejected before dispatch - unknown metric, metric mismatch, a failed
        validation rule - never reached a calculator and is counted nowhere here, so `failureRatePercent` measures the
        service rather than its callers.

        The code rankings under `overall` are merged from the complete per-metric tallies, so a code that sits just below
        the cut-off for every metric individually still shows up when it is the most frequent code service-wide.

        Everything here is held in memory and lost when the instance restarts. Counts, totals and `meanMillis` are
        cumulative since startup; `maxMillis` and the percentiles come from the registry's rolling distribution window, so
        after a quiet period they read low or zero while `samples` stays where it was.
      operationId: statistics
      responses:
        "200":
          description: OK
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: "#/components/schemas/CalculationStatisticsReport"
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                $ref: "#/components/schemas/CalculationStatisticsReport"
            application/json:
              schema:
                $ref: "#/components/schemas/CalculationStatisticsReport"
components:
  schemas:
    AverageMerCommand:
      required:
      - holdings
      type: object
      properties:
        metric:
          type: string
          description: Available portfolio calculation metrics
          enum:
          - mer
          - management-fee
          - fees
        dataProviders:
          type: array
          description: Data providers to use for fetching security data; configured
            defaults apply when absent
          example:
          - MORNINGSTAR
          items:
            $ref: "#/components/schemas/DataProvider"
        holdings:
          minItems: 1
          type: array
          description: Portfolio holdings to analyze; in a composite request they
            may come from the shared top level
          items:
            oneOf:
            - $ref: "#/components/schemas/PortfolioHolding"
            - $ref: "#/components/schemas/CashHolding"
            - $ref: "#/components/schemas/GicHolding"
        parameterTypes:
          type: array
          description: "Fee aggregation modes to calculate. Wire values map to FeeAggregationMode:\
            \ 'scaled' = FUNDS_ONLY (fund holdings only, weights normalised within\
            \ the fund subset); 'absolute' = WHOLE_PORTFOLIO (all holdings; non-fund\
            \ holdings contribute 0% but their market value is in the denominator);\
            \ 'forceReportFee' = FUNDS_ONLY_STRICT (same set as FUNDS_ONLY, but returns\
            \ null if any included holding fell back to a secondary fee field). Defaults\
            \ to ['scaled', 'absolute'] when omitted."
          example:
          - scaled
          - absolute
          - forceReportFee
          items:
            type: string
            enum:
            - scaled
            - absolute
            - forceReportFee
        targetCurrency:
          type: string
          description: "Currency to report money amounts in. Every holding's market\
            \ value is FX-converted into it before weighting or summing, so weights\
            \ stay comparable across a multi-currency portfolio. Omit to use the service's\
            \ configured reporting currency (CAD)."
          example: CAD
          enum:
          - CAD
          - CAD_HEDGED
          - USD
          - MXN
          - EUR
          - AUD
          - HKD
          - GBP
          - JPY
          - CHF
          - CNY
          - SEK
          - NOK
          - DKK
          - SGD
          - NZD
          - INR
          - KRW
          - TWD
          - IDR
          - MYR
          - PHP
          - PKR
          - BRL
          - CLP
          - COP
          - PEN
          - PLN
          - CZK
          - ZAR
          - RUB
        projectionPeriods:
          uniqueItems: true
          type: array
          description: "Periods to project fee amounts over, named or given as a length\
            \ in months. ONE_MTH reproduces the monthly fee and ONE_YR the annual\
            \ one. Applies only to the metrics that report projected amounts — 'fees'\
            \ and 'mer-benchmark-comparison'. 'mer' and 'management-fee' report rates,\
            \ which have no length, and ignore it. Omit to use the service's configured\
            \ periods."
          example:
          - ONE_MTH
          - ONE_YR
          - FIVE_YR
          - TEN_YR
          - TWENTY_YR
          items:
            type: string
            enum:
            - YTD
            - ONE_MTH
            - TWO_MTH
            - THREE_MTH
            - FOUR_MTH
            - FIVE_MTH
            - SIX_MTH
            - SEVEN_MTH
            - EIGHT_MTH
            - NINE_MTH
            - TEN_MTH
            - ELEVEN_MTH
            - ONE_YR
            - TWO_YR
            - THREE_YR
            - FOUR_YR
            - FIVE_YR
            - SIX_YR
            - SEVEN_YR
            - EIGHT_YR
            - NINE_YR
            - TEN_YR
            - ELEVEN_YR
            - TWELVE_YR
            - THIRTEEN_YR
            - FOURTEEN_YR
            - FIFTEEN_YR
            - TWENTY_YR
            - TWENTY_FIVE_YR
            - THIRTY_YR
            - SI
            - QTD
            - OVERALL
            - ITD
            - CIPSD
      description: "Command for fee ratio calculations. Supports metrics: mer, management-fee,\
        \ fees"
    CalculationCommand:
      type: object
      properties:
        metric:
          type: string
          description: Available portfolio calculation metrics
          enum:
          - trailing-total-returns
          - annual-returns
          - growth-of-10k
          - standard-deviation
          - sharpe-ratio
          - max-drawdown
          - asset-allocations
          - asset-allocations-em
          - equity-sector
          - sector-exposure
          - equity-country-exposure
          - equity-geographic-exposure
          - geographic-exposure
          - fixed-income-country-exposure
          - fixed-income-geographic-exposure
          - fixed-income-bond-sector
          - mer
          - management-fee
          - fees
          - mer-benchmark-comparison
          - common-performance-dates
          - top-common-holdings
          - number-of-unique-holdings
        dataProviders:
          type: array
          description: Data providers to use for fetching security data; configured
            defaults apply when absent
          example:
          - MORNINGSTAR
          items:
            $ref: "#/components/schemas/DataProvider"
      description: "Calculation command: the 'metric' discriminator selects which\
        \ of the alternatives below the rest of the payload has to satisfy"
      discriminator:
        propertyName: metric
        mapping:
          trailing-total-returns: "#/components/schemas/PeriodCommand"
          annual-returns: "#/components/schemas/ReturnCommand"
          growth-of-10k: "#/components/schemas/ReturnCommand"
          standard-deviation: "#/components/schemas/PeriodCommand"
          sharpe-ratio: "#/components/schemas/PeriodCommand"
          max-drawdown: "#/components/schemas/PeriodCommand"
          asset-allocations: "#/components/schemas/PortfolioHoldingsCommand"
          asset-allocations-em: "#/components/schemas/PortfolioHoldingsCommand"
          equity-sector: "#/components/schemas/PortfolioHoldingsCommand"
          sector-exposure: "#/components/schemas/PortfolioHoldingsCommand"
          equity-country-exposure: "#/components/schemas/PortfolioHoldingsCommand"
          equity-geographic-exposure: "#/components/schemas/PortfolioHoldingsCommand"
          geographic-exposure: "#/components/schemas/PortfolioHoldingsCommand"
          fixed-income-country-exposure: "#/components/schemas/PortfolioHoldingsCommand"
          fixed-income-geographic-exposure: "#/components/schemas/PortfolioHoldingsCommand"
          fixed-income-bond-sector: "#/components/schemas/PortfolioHoldingsCommand"
          mer: "#/components/schemas/AverageMerCommand"
          management-fee: "#/components/schemas/AverageMerCommand"
          fees: "#/components/schemas/AverageMerCommand"
          mer-benchmark-comparison: "#/components/schemas/MerComparisonCommand"
          common-performance-dates: "#/components/schemas/MultiplePortfoliosCommand"
          top-common-holdings: "#/components/schemas/TopCommonHoldingsCommand"
          number-of-unique-holdings: "#/components/schemas/PortfolioHoldingsCommand"
      oneOf:
      - $ref: "#/components/schemas/PeriodCommand"
      - $ref: "#/components/schemas/ReturnCommand"
      - $ref: "#/components/schemas/PortfolioHoldingsCommand"
      - $ref: "#/components/schemas/TopCommonHoldingsCommand"
      - $ref: "#/components/schemas/AverageMerCommand"
      - $ref: "#/components/schemas/MerComparisonCommand"
      - $ref: "#/components/schemas/MultiplePortfoliosCommand"
    CashHolding:
      required:
      - holdingType
      - securityIdentifier
      type: object
      allOf:
      - $ref: "#/components/schemas/PortfolioHolding"
      - type: object
        properties:
          currency:
            type: string
            enum:
            - CAD
            - CAD_HEDGED
            - USD
            - MXN
            - EUR
            - AUD
            - HKD
            - GBP
            - JPY
            - CHF
            - CNY
            - SEK
            - NOK
            - DKK
            - SGD
            - NZD
            - INR
            - KRW
            - TWD
            - IDR
            - MYR
            - PHP
            - PKR
            - BRL
            - CLP
            - COP
            - PEN
            - PLN
            - CZK
            - ZAR
            - RUB
          investmentDate:
            type: string
            format: date
          clientIntRate:
            type: number
          interestFreq:
            type: string
            enum:
            - ANNUAL
            - SEMI_ANNUAL
            - QUARTERLY
            - BI_MONTHLY
            - MONTHLY
            - BI_WEEKLY
            - WEEKLY
            - DAILY
    CompositeCalculationRequest:
      required:
      - commands
      type: object
      properties:
        holdings:
          type: array
          description: Portfolio holdings shared by all commands; a command may override
            with its own holdings
          items:
            oneOf:
            - $ref: "#/components/schemas/PortfolioHolding"
            - $ref: "#/components/schemas/CashHolding"
            - $ref: "#/components/schemas/GicHolding"
        dataProviders:
          type: array
          description: Data providers shared by all commands; configured defaults
            apply when absent
          example:
          - MORNINGSTAR
          items:
            $ref: "#/components/schemas/DataProvider"
        currency:
          type: string
          description: Target currency shared by all currency-aware commands
          example: CAD
          enum:
          - CAD
          - CAD_HEDGED
          - USD
          - MXN
          - EUR
          - AUD
          - HKD
          - GBP
          - JPY
          - CHF
          - CNY
          - SEK
          - NOK
          - DKK
          - SGD
          - NZD
          - INR
          - KRW
          - TWD
          - IDR
          - MYR
          - PHP
          - PKR
          - BRL
          - CLP
          - COP
          - PEN
          - PLN
          - CZK
          - ZAR
          - RUB
        commands:
          minItems: 1
          type: array
          description: "Commands to execute, each carrying its metric and metric-specific\
            \ parameters"
          items:
            $ref: "#/components/schemas/CalculationCommand"
      description: Composite calculation request with shared portfolio inputs and
        one command per metric
    DataProvider:
      type: string
      description: Data provider sources for security information
      enum:
      - MORNINGSTAR
      - FMP
      - BOC
    EquitySecurityIdentifier:
      required:
      - exchangeId
      - id
      - idType
      type: object
      description: Extended security identifier for equities requiring exchange disambiguation.
        Used when idType is TICKER_MIC.
      allOf:
      - $ref: "#/components/schemas/SecurityIdentifier"
      - type: object
        properties:
          exchangeId:
            minLength: 1
            type: string
            description: Market Identifier Code (MIC) to disambiguate the exchange
            example: XNAS
    FiIdentifierType:
      type: string
      description: Types of financial instrument identifiers
      example: TICKER
      enum:
      - TICKER
      - TICKER_MIC
      - CUSIP
      - ISIN
      - SEDOL
      - FUNDSERV
      - MORNINGSTAR_ID
      - HOLDER_MORNINGSTAR_ID
      - EXCHANGE_ID
      - CIK
    FinancialInstrumentType:
      type: string
      description: Types of financial instruments. Country is modelled as an orthogonal
        dimension (see Country) rather than being encoded in the type. Parent-child
        relationships express type inheritance for attribute lookups.
      enum:
      - ETF
      - STOCK
      - BENCHMARK_INDEX
      - CASH
      - FUND
      - MUTUAL_FUND
      - SEGREGATED_FUND
      - POOLED_FUND
      - HEDGE_FUND
      - SEPARATELY_MANAGED_ACCOUNT
      - GIC
      - UNKNOWN_BROADRIDGE
      - FIXED_INCOME
      - HOLDING
      - SECURITY_HOLDING
      - INDEX_HOLDING
      - ETF_HOLDING
      - FUND_HOLDING
      - INDEX_BROAD_HOLDING
      - SEPARATELY_MANAGED_ACCOUNT_HOLDING
    GicHolding:
      required:
      - holdingType
      - securityIdentifier
      type: object
      allOf:
      - $ref: "#/components/schemas/PortfolioHolding"
      - type: object
        properties:
          uuid:
            type: string
            format: uuid
          currency:
            type: string
            enum:
            - CAD
            - CAD_HEDGED
            - USD
            - MXN
            - EUR
            - AUD
            - HKD
            - GBP
            - JPY
            - CHF
            - CNY
            - SEK
            - NOK
            - DKK
            - SGD
            - NZD
            - INR
            - KRW
            - TWD
            - IDR
            - MYR
            - PHP
            - PKR
            - BRL
            - CLP
            - COP
            - PEN
            - PLN
            - CZK
            - ZAR
            - RUB
          investmentDate:
            type: string
            format: date
          clientIntRate:
            type: number
          interestFreq:
            type: string
            enum:
            - ANNUAL
            - SEMI_ANNUAL
            - QUARTERLY
            - BI_MONTHLY
            - MONTHLY
            - BI_WEEKLY
            - WEEKLY
            - DAILY
          term:
            type: number
          name:
            type: string
    MerComparisonCommand:
      required:
      - holdings
      type: object
      properties:
        metric:
          type: string
          description: Available portfolio calculation metrics
          enum:
          - mer-benchmark-comparison
        dataProviders:
          type: array
          description: Data providers to use for fetching security data; configured
            defaults apply when absent
          example:
          - MORNINGSTAR
          items:
            $ref: "#/components/schemas/DataProvider"
        holdings:
          minItems: 1
          type: array
          description: Portfolio holdings to analyze; in a composite request they
            may come from the shared top level
          items:
            oneOf:
            - $ref: "#/components/schemas/PortfolioHolding"
            - $ref: "#/components/schemas/CashHolding"
            - $ref: "#/components/schemas/GicHolding"
        parameterTypes:
          type: array
          description: "Fee aggregation modes to calculate. Wire values map to FeeAggregationMode:\
            \ 'scaled' = FUNDS_ONLY (fund holdings only, weights normalised within\
            \ the fund subset); 'absolute' = WHOLE_PORTFOLIO (all holdings; non-fund\
            \ holdings contribute 0% but their market value is in the denominator);\
            \ 'forceReportFee' = FUNDS_ONLY_STRICT (same set as FUNDS_ONLY, but returns\
            \ null if any included holding fell back to a secondary fee field). Defaults\
            \ to ['scaled', 'absolute'] when omitted."
          example:
          - scaled
          - absolute
          - forceReportFee
          items:
            type: string
            enum:
            - scaled
            - absolute
            - forceReportFee
        targetCurrency:
          type: string
          description: "Currency to report money amounts in. Every holding's market\
            \ value is FX-converted into it before weighting or summing, so weights\
            \ stay comparable across a multi-currency portfolio. Omit to use the service's\
            \ configured reporting currency (CAD)."
          example: CAD
          enum:
          - CAD
          - CAD_HEDGED
          - USD
          - MXN
          - EUR
          - AUD
          - HKD
          - GBP
          - JPY
          - CHF
          - CNY
          - SEK
          - NOK
          - DKK
          - SGD
          - NZD
          - INR
          - KRW
          - TWD
          - IDR
          - MYR
          - PHP
          - PKR
          - BRL
          - CLP
          - COP
          - PEN
          - PLN
          - CZK
          - ZAR
          - RUB
        projectionPeriods:
          uniqueItems: true
          type: array
          description: "Periods to project fee amounts over, named or given as a length\
            \ in months. ONE_MTH reproduces the monthly fee and ONE_YR the annual\
            \ one. Applies only to the metrics that report projected amounts — 'fees'\
            \ and 'mer-benchmark-comparison'. 'mer' and 'management-fee' report rates,\
            \ which have no length, and ignore it. Omit to use the service's configured\
            \ periods."
          example:
          - ONE_MTH
          - ONE_YR
          - FIVE_YR
          - TEN_YR
          - TWENTY_YR
          items:
            type: string
            enum:
            - YTD
            - ONE_MTH
            - TWO_MTH
            - THREE_MTH
            - FOUR_MTH
            - FIVE_MTH
            - SIX_MTH
            - SEVEN_MTH
            - EIGHT_MTH
            - NINE_MTH
            - TEN_MTH
