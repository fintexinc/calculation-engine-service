# Maven Wrapper — pins the Maven version used by every build of this repo,
# so a bare JDK is enough to build it (CI, containers, a fresh laptop).
#
# `only-script` distribution: the mvnw script downloads Maven itself and no
# binary jar is committed to the repository.
wrapperVersion=3.3.2
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
