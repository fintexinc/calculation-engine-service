spring:
  application:
    name: calculation-engine
    config:
      fail-fast: true
      enabled: false
    discovery:
      client:
        composite-indicator:
          enabled: false
  lettuce:
    pool:
      max-idle: 10
      max-wait: 5000
      min-idle: 3
      max-active: 15

management:
  endpoint:
    health:
      show-details: always
      group:
        calculations:
          include: merCalculation,growthOf10kCalculation,upsideCaptureCalculation
          show-components: always
          show-details: always
          status:
            http-mapping:
              down: 400
              fatal: 400
              out-of-service: 400

  endpoints:
    web:
      exposure:
        include: env, health, configprops, caches, httptrace, loggers, metrics, mappings, threaddump

rest-template:
  rest-template-pool:
    size-per-route: 50
    size: 100
  rest-template:
    read-timeout: 90000 # time in millis
    connection-request-timeout: 90000 # time in millis, 1 * 60 * 1000
    connect-timeout: 90000 # time in millis

security-master:
  web-protocol: rest # "graphql" or "rest"
  rest:
    base-url: ${SM_REST_BASE_URL:http://localhost:8080}
    timeout: 90000

application:
  rest-template-enabled: true

default:
  periods:
    trailing-total-returns: "1,3,6,12,36,60,120,YEAR_TO_DATE,SINCE_PERFORMANCE_START_DATE"
    leading-total-returns: "1,3,6,12,36,60,120"
    rolling-calculations: "12, 36, 60, 120"
    information-ratio-returns: "12, 36, 60, 120"
    risk-calculations: "12,36,60,120"
    best-worst-periods: 12,36,60,120
  top-common-holdings:
    accumulate-types: "E,ER,B,BC,BD,BT"
    recursion-types: "FO,FE,FS,EX"

redis:
  timeout: 300000
  password: ${REDIS_PASSWORD}
  username: ${REDIS_USERNAME}

ssl:


exception:
  show-stack-trace: true

proxy:
  useProxy: false

logging:
  level:
    root: INFO

performance-monitor-duration:
  info-threshold: 59000 #59 seconds
