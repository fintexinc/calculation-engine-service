spring:
  application:
    name: calculation-engine
    config:
      fail-fast: true
      enabled: false
    discovery:
      client:
        composite-indicator:
          enabled: false

cache:
  data:
    fx-rates:
      enabled: true
      max-entries: 4096
      recency-cutoff-days: 1

external-services:
  bank-of-canada:
    base-url: https://www.bankofcanada.ca/valet
    timeout: 30000
    health-check-path: /lists/series/json
    currency-pairs:
      USD_CAD:
        rate-sources:
          - path: /observations/FXUSDCAD/json
            series-names:
              - FXUSDCAD   # daily USD/CAD rate (2017+)
            start-date: "2017-01-01"
            frequency: DAILY
          - path: /observations/IEXM0101/json
            series-names:
              - IEXM0101   # monthly USD/CAD noon rate (1999–2017)
            end-date: "2016-12-31"
            frequency: MONTHLY
      EUR_CAD:
        rate-sources:
          - path: /observations/FXEURCAD/json
            series-names:
              - FXEURCAD   # daily EUR/CAD rate (2017+)
            start-date: "2017-01-01"
            frequency: DAILY
      GBP_CAD:
        rate-sources:
          - path: /observations/FXGBPCAD/json
            series-names:
              - FXGBPCAD   # daily GBP/CAD rate (2017+)
            start-date: "2017-01-01"
            frequency: DAILY
      AUD_CAD:
        rate-sources:
          - path: /observations/FXAUDCAD/json
            series-names:
              - FXAUDCAD   # daily AUD/CAD rate (2017+)
            start-date: "2017-01-01"
            frequency: DAILY
      JPY_CAD:
        rate-sources:
          - path: /observations/FXJPYCAD/json
            series-names:
              - FXJPYCAD   # daily JPY/CAD rate (2017+)
            start-date: "2017-01-01"
            frequency: DAILY
      CNY_CAD:
        rate-sources:
          - path: /observations/FXCNYCAD/json
            series-names:
              - FXCNYCAD   # daily CNY/CAD rate (2017+)
            start-date: "2017-01-01"
            frequency: DAILY
      MXN_CAD:
        rate-sources:
          - path: /observations/FXMXNCAD/json
            series-names:
              - FXMXNCAD   # daily MXN/CAD rate (2017+)
            start-date: "2017-01-01"
            frequency: DAILY
      CHF_CAD:
        rate-sources:
          - path: /observations/FXCHFCAD/json
            series-names:
              - FXCHFCAD   # daily CHF/CAD rate (2017+)
            start-date: "2017-01-01"
            frequency: DAILY
  security-master:
    api-type: rest  # "rest" (default) or "graphql"
    rest:
      base-url: ${SM_REST_BASE_URL}
      timeout: 60000
      health-check-path: /actuator/health
      endpoints:
        allocations:
          asset: /api/v1/wealth/securities/allocations/asset
          equity-sector: /api/v1/wealth/securities/allocations/equity-sector
          fixed-income-sector: /api/v1/wealth/securities/allocations/fixed-income-sector
          equity-stylebox: /api/v1/wealth/securities/allocations/equity-stylebox
          fixed-income-stylebox: /api/v1/wealth/securities/allocations/fixed-income-stylebox
          equity-market-cap: /api/v1/wealth/securities/allocations/equity-market-cap
          country: /api/v1/wealth/securities/allocations/country
          equity-country: /api/v1/wealth/securities/allocations/equity-country
          maturities: /api/v1/wealth/securities/allocations/maturities
          credit-quality: /api/v1/wealth/securities/allocations/credit-quality
          classification: /api/v1/wealth/securities/allocations/classification
        income: /api/v1/wealth/securities/income
        fees: /api/v1/wealth/securities/fees
        sales-charge: /api/v1/wealth/securities/sales-charge
        holdings:
          identifiers: /api/v1/wealth/securities/holdings/identifiers
          top: /api/v1/wealth/securities/top-holdings
        returns:
          monthly: /api/v1/wealth/securities/returns/monthly

rest-template:
  rest-template-pool:
    size-per-route: 50
    size: 100
  rest-template:
    read-timeout: 90000 # time in millis
    connection-request-timeout: 90000 # time in millis, 1 * 60 * 1000
    connect-timeout: 90000 # time in millis

application:
  rest-template-enabled: true

default:
  data-providers: MORNINGSTAR
  # by which type of ids to count the unique number of holdings in a portfolio
  # MORNINGSTAR_ID is chosen due to the best availability of the data
  holdings-identifier-type: MORNINGSTAR_ID
  periods:
    trailing-total-returns: "1,3,6,12,36,60,120,YEAR_TO_DATE,SINCE_PERFORMANCE_START_DATE"
    leading-total-returns: "1,3,6,12,36,60,120"
    rolling-calculations: "12, 36, 60, 120"
    information-ratio-returns: "12, 36, 60, 120"
    risk-calculations: "12,36,60,120"
    best-worst-periods: 12,36,60,120
  top-common-holdings:
    accumulate-types: "E,ER,B,BC,BD,BT"
    recursion-types: "FO,FE,FS,EX"

management:
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: b3
  observations:
    http:
      server:
        requests:
          name: http.server.requests
      client:
        requests:
          name: http.client.requests
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, sms
        liveness:
          include: livenessState
  health:
    diskspace:
      enabled: false

logging:
  level:
    root: INFO
    com.fintex.ce: DEBUG
  http:
    # Defaults for headers/query/payload logging are intentionally `false`
    # (see HttpLoggingProperties). Override per environment to opt in.
    enabled: true

springdoc:
  api-docs:
    path: /api/v1/c7f3e2a1-9b4d-4e8f-a6c2-1d5e7f9b3a2c/api-docs
    version: openapi_3_0
  swagger-ui:
    path: /api/v1/c7f3e2a1-9b4d-4e8f-a6c2-1d5e7f9b3a2c/swagger-ui
