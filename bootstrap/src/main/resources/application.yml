spring:
  application:
    name: calculation-engine
    config:
      fail-fast: true
      enabled: false
    discovery:
      client:
        composite-indicator:
          enabled: false

cache:
  data:
    fx-rates:
      enabled: true
      max-entries: 4096
    t-bills:
      enabled: true
      refresh-after: 24h

external-services:
  bank-of-canada:
    base-url: https://www.bankofcanada.ca/valet
    timeout: 30000
    health-check-path: /lists/series/json
    currency-pairs:
      USD_CAD:
        rate-sources:
          - path: /observations/FXUSDCAD/json
            series-names:
              - FXUSDCAD   # daily USD/CAD rate (2017+)
            start-date: "2017-01-01"
            frequency: DAILY
          - path: /observations/IEXM0101/json
            series-names:
              - IEXM0101   # monthly USD/CAD noon rate (1999–2017)
            end-date: "2016-12-31"
            frequency: MONTHLY
      EUR_CAD:
        rate-sources:
          - path: /observations/FXEURCAD/json
            series-names:
              - FXEURCAD   # daily EUR/CAD rate (2017+)
            start-date: "2017-01-01"
            frequency: DAILY
      GBP_CAD:
        rate-sources:
          - path: /observations/FXGBPCAD/json
            series-names:
              - FXGBPCAD   # daily GBP/CAD rate (2017+)
            start-date: "2017-01-01"
            frequency: DAILY
      AUD_CAD:
        rate-sources:
          - path: /observations/FXAUDCAD/json
            series-names:
              - FXAUDCAD   # daily AUD/CAD rate (2017+)
            start-date: "2017-01-01"
            frequency: DAILY
      JPY_CAD:
        rate-sources:
          - path: /observations/FXJPYCAD/json
            series-names:
              - FXJPYCAD   # daily JPY/CAD rate (2017+)
            start-date: "2017-01-01"
            frequency: DAILY
      CNY_CAD:
        rate-sources:
          - path: /observations/FXCNYCAD/json
            series-names:
              - FXCNYCAD   # daily CNY/CAD rate (2017+)
            start-date: "2017-01-01"
            frequency: DAILY
      MXN_CAD:
        rate-sources:
          - path: /observations/FXMXNCAD/json
            series-names:
              - FXMXNCAD   # daily MXN/CAD rate (2017+)
            start-date: "2017-01-01"
            frequency: DAILY
      CHF_CAD:
        rate-sources:
          - path: /observations/FXCHFCAD/json
            series-names:
              - FXCHFCAD   # daily CHF/CAD rate (2017+)
            start-date: "2017-01-01"
            frequency: DAILY
  market-investment-catalogue:
    api-type: rest  # "rest" (default) or "graphql"
    rest:
      base-url: ${MIC_REST_BASE_URL}
      timeout: 60000
      # Ceiling on a buffered MIC response body, in bytes. Well above Spring's 256 KB default: LIMITED_HOLDINGS carries a
      # fund's holdings looked through to leaf instruments (~2.7 MB for the heaviest security measured) and a whole
      # portfolio is fetched at once. Coupled to MIC's max-holdings-percentage-per-security - raise both together.
      max-in-memory-size: 33554432
      health-check-path: /actuator/health
      endpoints:
        # Single generic endpoint returning any combination of security attributes; supersedes the per-attribute endpoints.
        attributes: /api/v1/wealth/securities/attributes
        reference:
          # MIC exposes combined US + CAD T-Bill monthly returns at this endpoint; PCE selects the side it needs.
          treasury-rates: /api/v1/wealth/reference/treasury-rates

calculation:
  fx:
    # Reporting currency that money-value calculations (fees, MER, management fee, AUM, allocations) convert into
    # before weighting / summing. Pick the currency comparable across all multi-currency holdings in the portfolio.
    default-target-currency: CAD
  validation:
    # Countries whose securities the engine can price and process. Holdings from any other country are rejected.
    supported-security-countries:
      - USA
      - CANADA
  fee:
    projection:
      # Answers "what will these fees have cost me by then?" — one column per period.
      # TimePeriod members, named or given as a length in months; ONE_MTH is the monthly fee and ONE_YR the
      # annual one. Must be non-empty, and every value must be one the fee metrics can project
      # (SupportedPeriods.FEE_PROJECTION — fixed lengths only, so no YTD or SI).
      periods: "12,120,240"

      # Assumed annual growth of the balance the fee is charged on, as a ratio: 0.06 = 6% a year.
      # The fee is charged on that growing balance every year and summed, so a period costs more than
      # annualFee x years. A 2% fee on $100k (annualFee 2,000) projects to:
      #   0.06  ->  10Y 26,361.59   20Y 73,571.18   <- shipped assumption
      #   0     ->  10Y 20,000.00   20Y 40,000.00   <- flat balance, exactly annualFee x years
      #  -0.20  ->  10Y  8,926.26   20Y  9,884.71   <- shrinking balance, so later fees are smaller
      # The 20Y column nearly doubles between the first two rows, which is why this is configuration
      # and not a constant: a 20Y figure cannot be read without knowing which row produced it.
      #
      # The fee is not treated as a drag: the balance grows at this rate whatever is paid out in fees.
      # Accepted range is -1 upwards. At -1 the balance is gone after the first year, so exactly one
      # annual fee is charged. Below -1 the balance would lose more than 100%, which no portfolio can
      # do, and the service refuses to start.
      annual-growth-rate: 0.06

default:
  data-providers: MORNINGSTAR, FMP
  # by which type of ids to count the unique number of holdings in a portfolio
  # MORNINGSTAR_ID is chosen due to the best availability of the data
  holdings-identifier-type: MORNINGSTAR_ID
  periods:
    # Values are TimePeriod members (catalogue-investment-commons), given either by name or by their length in months.
    # YTD = year to date, SI = since inception — both resolve their length from the data rather than carrying one.
    trailing-total-returns: "1,3,6,12,36,60,120,240,YTD,SI"
    risk-calculations: "12,36,60,120,240"
  top-common-holdings:
    accumulate-types:
      - E
      - ER
      - B
      - BC
      - BD
      - BT
    default-num-of-top-common-holdings: 10
    max-recursion-depth: 5
    max-leaves-per-holding: 10000

resilience4j:
  retry:
    configs:
      default:
        # Three attempts total. Retrying is only worth it for a failure the provider recovers from on its own, and past
        # a couple of attempts a slow failure costs the caller more latency than a fourth try is likely to redeem.
        max-attempts: 3
        wait-duration: 500ms
        # Exponential with jitter, because one portfolio calculation fans out to the same provider in parallel: a fixed
        # delay would send every failed call back at the same instant and reproduce the load that caused the failure.
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exception-predicate: com.fintex.ce.adapter.webclient.resilience.TransientCallFailures
    instances:
      MARKET_INVESTMENT_CATALOGUE:
        base-config: default
      BANK_OF_CANADA:
        base-config: default
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 50
        # Below this many calls the breaker stays closed whatever the failure rate, so a handful of failures in a burst
        # of calculations cannot open it on a sample too small to mean anything.
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        # Measured per attempt, not per logical call: a provider answering but taking this long holds the calling
        # thread without ever raising an error, so each such attempt is counted as a failure in its own right. Attempts
        # individually under this threshold can still add up to a slow logical call — that budget is capped separately
        # by resilience4j.timelimiter below.
        slow-call-duration-threshold: 20s
        slow-call-rate-threshold: 100
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        # Recovery without any caller having to arrive first, so a quiet period while the breaker was open does not
        # leave it open for the next calculation to discover.
        automatic-transition-from-open-to-half-open-enabled: true
        record-failure-predicate: com.fintex.ce.adapter.webclient.resilience.TransientCallFailures
        register-health-indicator: true
    instances:
      MARKET_INVESTMENT_CATALOGUE:
        base-config: default
      # Bank of Canada is called a few times per calculation for FX rates rather than in bulk, so its window and
      # threshold are scaled down below the shared default to the traffic it actually sees; the 50-call window would
      # take too long to fill.
      BANK_OF_CANADA:
        base-config: default
        sliding-window-size: 10
        minimum-number-of-calls: 3
        slow-call-duration-threshold: 5s
  timelimiter:
    configs:
      default:
        # Deadline for the whole logical call — every retry attempt plus the backoff between them. The per-attempt
        # response timeout on each HTTP client cannot cap this: it multiplies by the number of attempts, so without
        # this ceiling the worst case handed to the caller is that timeout times every retry. Sized to one full
        # 60-second Market Investment Catalogue attempt plus room for fast-failing retries; a second slow attempt is cut off
        # rather than doubling the caller's wait. This is also the fallback for any instance not listed below —
        # Resilience4j's own default would be 1 second, which no real call here can meet.
        timeout-duration: 90s
    instances:
      MARKET_INVESTMENT_CATALOGUE:
        base-config: default
      BANK_OF_CANADA:
        base-config: default
        # Scaled to Bank of Canada's 30-second per-attempt timeout the same way the default is to Market Investment Catalogue's.
        timeout-duration: 45s

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    # Adopt a parent service's trace id whether it sends W3C traceparent or either B3 form, and emit W3C downstream.
    # Keeps incoming trace-context formats aligned with the outgoing W3C trace context.
    propagation:
      consume: w3c,b3,b3_multi
      produce: w3c
  metrics:
    distribution:
      # Client-side percentiles: the registry computes p50/p95/p99 itself, so they are readable from
      # /actuator/calculationstats and from whatever the meters are exported to. Prefixes match by dot-separated
      # segment, so `external` covers external.provider.request and `portfolio.calculation` covers both
      # portfolio.calculation.request and portfolio.calculation.duration. This is the only place that decides which
      # percentiles are published.
      percentiles:
        external: 0.5, 0.95, 0.99
        portfolio.calculation: 0.5, 0.95, 0.99
        http.server.requests: 0.5, 0.95, 0.99
        http.client.requests: 0.5, 0.95, 0.99
      # Window the percentiles are computed over. Micrometer keeps a rolling histogram and reports 0 once the window
      # rotates with no new recordings, so the window has to outlast the gaps in the traffic it measures. Outbound
      # provider traffic is bursty, so a few minutes would read 0 almost always; a day keeps the last burst legible.
      # Inbound request traffic is continuous, so a short window there stays both populated and current.
      #
      # `portfolio.calculation` is deliberately absent: /actuator/calculationstats reports cumulative counts beside
      # these percentiles, and an expiry would have it serve a p95 of zero next to a live sample count.
      expiry:
        external: 24h
        http.server.requests: 5m
        http.client.requests: 24h
      # Percentile estimation buckets values inside the expected range and clamps anything above the maximum, so the
      # default 30s ceiling would report every slow call at the ceiling. Provider calls are bounded by their own
      # timeouts, and a composite calculation can outlast a single request timeout.
      maximum-expected-value:
        external: 60s
        http.client.requests: 60s
        portfolio.calculation: 120s
  observations:
    key-values:
      application: ${spring.application.name}
    http:
      server:
        requests:
          name: http.server.requests
      client:
        requests:
          name: http.client.requests
  endpoints:
    web:
      exposure:
        # `metrics` stays unexposed: it enumerates every meter name and tag value, which is why
        # ActuatorExposureConfigurationTest pins it shut. `calculationstats` is the curated read model over the same
        # meters and is safe to serve; read raw meters through the exporter, not over HTTP.
        #
        # `circuitbreakers` and `retries` serve the current state of each resilience instance, which is bounded and safe
        # to read. The matching `*events` endpoints stay shut for the same reason as `metrics`: they replay a rolling
        # buffer carrying the upstream exception messages of individual calls, which belongs in the logs and the
        # exporter.
        include: health, info, calculationstats, circuitbreakers, retries
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, mic
        liveness:
          include: livenessState
      # An open breaker is reported as its own status rather than as DOWN: it means a provider is unreachable, not that
      # this service is, and DOWN would answer the probe with 503 and take the pod out of rotation over someone else's
      # outage. Slotting the two breaker statuses below OUT_OF_SERVICE keeps them visible without ever masking a real
      # failure elsewhere, and neither maps to an error status code. Left out of the order, they would be treated as
      # unknown codes and sort as the least severe status there is, so an open breaker would never surface at all. The
      # order has to live here — `management.health.status.order` is not bound to anything and is silently ignored.
      status:
        order: DOWN,OUT_OF_SERVICE,CIRCUIT_OPEN,CIRCUIT_HALF_OPEN,UP,UNKNOWN
  health:
    diskspace:
      enabled: false
    # The breaker states reach /actuator/health as one composite indicator. It is deliberately kept out of the
    # `readiness` group above: a provider outage must not remove this pod from rotation, only report itself.
    circuitbreakers:
      enabled: true

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}, spanId=%X{spanId:-}, requestId=%X{requestId:-}]"
  level:
    root: INFO
    com.fintex.ce: DEBUG
  http:
    # Defaults for headers/query/payload logging are intentionally `false`
    # (see HttpLoggingProperties). Override per environment to opt in.
    enabled: true

springdoc:
  api-docs:
    path: /api/v1/c7f3e2a1-9b4d-4e8f-a6c2-1d5e7f9b3a2c/api-docs
    version: openapi_3_0
  swagger-ui:
    path: /api/v1/c7f3e2a1-9b4d-4e8f-a6c2-1d5e7f9b3a2c/swagger-ui
  # Documents the exposed actuator endpoints (health, info, calculationstats) in the same OpenAPI document, so the
  # observability surface is discoverable from Swagger UI. Only endpoints in the exposure list above appear here.
  show-actuator: true
