server:
  port: 8181

external-services:
  security-master:
    rest:
      log-body: true
      log-requests: true

logging:
  level:
    reactor.netty.http.client.HttpClient: TRACE
    com.fintex.ce.adapter.rest.logging: TRACE
  http:
    include-headers: true
    include-query-string: true
    include-payload: true

sms:
  runner:
    enabled: false
