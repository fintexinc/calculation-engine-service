server:
  port: 8181

external-services:
  market-investment-catalogue:
    rest:
      log-body: true
      log-requests: true

logging:
  level:
    reactor.netty.http.client.HttpClient: TRACE
    ca.tangerine.pce.rest.logging: TRACE
  http:
    include-headers: true
    include-query-string: true
    include-payload: true

mic:
  runner:
    enabled: false
