manual:
  fds-url: https://security-master-service.fintex.com/graphql

  rest:
    application-url: http://localhost:8080
    application-1x5-url: http://localhost:9000
    application-1x3-url: http://localhost:9000
    content-type: application/json

    api-v1x5:
      leading-returns: /api/fact-calculation
      max-drawdown: /api/fact-calculation

  versions:
    enable-ce-1.0: true

# When SM_REST_BASE_URL is unset; SM fetcher ITs override via @DynamicPropertySource (MockWebServer).
external-services:
  security-master:
    rest:
      base-url: http://127.0.0.1:1

# Retries stay on (the e2e suite asserts them) but back off in milliseconds, so a test that exhausts all attempts
# costs milliseconds instead of seconds. The circuit breaker never opens here: the failure scenarios each class runs
# would otherwise count against a shared breaker and could fail later tests in the same JVM by test order alone.
# Breaker behaviour itself is covered by unit tests in web-client-adapter.
resilience4j:
  retry:
    configs:
      default:
        wait-duration: 25ms
  circuitbreaker:
    configs:
      default:
        minimum-number-of-calls: 1000000
