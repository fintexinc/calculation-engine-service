[versions]
spring-boot = "4.1.0"
spring-dependency-management = "1.1.7"
spotless = "8.10.0"
jib = "3.4.4"
lombok = "8.11"
git-properties = "4.0.1"

# Internal dependencies. The Tangerine line consumes the commons build published from that library's own
# tangerine-release branch, which is a narrower subset — no SalesChargeType, no FixedIncomeStyleBoxType.
# The pin could not move before this commit: the metrics reading those types are the ones deleted here.
cic = "0.1.0-tangerine-SNAPSHOT"

# External dependencies whose versions the Spring Boot BOM does not manage.
springdoc = "3.1.0"
swagger-annotations = "2.2.52"
commons-lang3 = "3.20.0"
guava = "32.1.3-jre"
# One ref for every resilience4j artifact, which is what importing resilience4j-bom bought in Maven:
# they release together, and resilience4j-spring-boot4 is outside the bom yet has to match it.
resilience4j = "2.4.0"

# Test dependencies. Mockito and AssertJ stay pinned, as they were in the Maven build; the values track the
# Boot 4.1 BOM so the pins no longer silently downgrade what the BOM would have picked.
mockito = "5.23.0"
assertj = "3.27.7"
okhttp-mockwebserver = "4.12.0"
commons-math3 = "3.6.1"

[libraries]
catalogue-investment-commons = { module = "ca.tangerine.sharedlibs:catalogue-investment-commons", version.ref = "cic" }

jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }

slf4j-api = { module = "org.slf4j:slf4j-api" }

spring-context = { module = "org.springframework:spring-context" }
spring-boot = { module = "org.springframework.boot:spring-boot" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
# Boot 4 split WebClient support out of the webflux starter, which now carries only the reactive server.
spring-boot-starter-webclient = { module = "org.springframework.boot:spring-boot-starter-webclient" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
# RestClient auto-configuration is its own module in Boot 4; starter-web no longer carries it, and the
# health indicators inject the auto-configured RestClient.Builder.
spring-boot-starter-restclient = { module = "org.springframework.boot:spring-boot-starter-restclient" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
# WebTestClient's test auto-configuration is its own module in Boot 4 and is not pulled by
# spring-boot-starter-test; the webflux-test starter would also drag a reactive server into an MVC app.
spring-boot-webtestclient = { module = "org.springframework.boot:spring-boot-webtestclient" }

micrometer-core = { module = "io.micrometer:micrometer-core" }
micrometer-observation = { module = "io.micrometer:micrometer-observation" }
micrometer-tracing-bridge-otel = { module = "io.micrometer:micrometer-tracing-bridge-otel" }
# Boot 4 moved the tracing auto-configuration out of actuator into per-bridge modules; this one contributes
# the Tracer bean over the OpenTelemetry bridge above.
spring-boot-micrometer-tracing-opentelemetry = { module = "org.springframework.boot:spring-boot-micrometer-tracing-opentelemetry" }
micrometer-context-propagation = { module = "io.micrometer:context-propagation" }

resilience4j-circuitbreaker = { module = "io.github.resilience4j:resilience4j-circuitbreaker", version.ref = "resilience4j" }
resilience4j-retry = { module = "io.github.resilience4j:resilience4j-retry", version.ref = "resilience4j" }
resilience4j-timelimiter = { module = "io.github.resilience4j:resilience4j-timelimiter", version.ref = "resilience4j" }
resilience4j-reactor = { module = "io.github.resilience4j:resilience4j-reactor", version.ref = "resilience4j" }
resilience4j-micrometer = { module = "io.github.resilience4j:resilience4j-micrometer", version.ref = "resilience4j" }
resilience4j-spring-boot4 = { module = "io.github.resilience4j:resilience4j-spring-boot4", version.ref = "resilience4j" }

caffeine = { module = "com.github.ben-manes.caffeine:caffeine" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }

springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
swagger-annotations-jakarta = { module = "io.swagger.core.v3:swagger-annotations-jakarta", version.ref = "swagger-annotations" }

junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp-mockwebserver" }
commons-math3 = { module = "org.apache.commons:commons-math3", version.ref = "commons-math3" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
jib = { id = "com.google.cloud.tools.jib", version.ref = "jib" }
lombok = { id = "io.freefair.lombok", version.ref = "lombok" }
git-properties = { id = "com.gorylenko.gradle-git-properties", version.ref = "git-properties" }
