# Azure DevOps Pipeline for Calculation Engine Service
# Builds, containerizes, and deploys to Azure Container Apps

trigger:
  branches:
    include:
      - main
pr:
  branches:
    include:
      - 'main'

variables:
  - group: secrets-for-pipelines

  # Container registry details
  - name: containerRegistry
    value: 'crfintexfndservdevcc01.azurecr.io'

  - name: containerRegistryName
    value: 'crfintexfndservdevcc01'

  - name: imageRepository
    value: 'calculation-engine-service'

  - name: tag
    value: '$(Build.BuildId)'

  # Azure service connections
  - name: azureServiceConnection
    value: 'azure-subscription-connection'

  # Environment configuration
  - name: environment
    value: 'dev'

  - name: resourceGroupName
    value: 'rg-fintex-fndserv-dev-cc-01'

  - name: managedEnvironmentName
    value: 'cae-fintex-fndserv-dev-cc-01'

  - name: containerAppName
    value: 'calculation-engine-service'

  # Build Configuration
  - name: mavenPomFile
    value: 'pom.xml'

  - name: mavenOptions
    value: '-DskipTests=true'

stages:
  - stage: Validate
    displayName: Check code style and run unit tests
    jobs:
      - job: CheckCodeStyle
        displayName: Check code style
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: Maven@4
            displayName: Run Spotless Check
            inputs:
              mavenPomFile: '$(mavenPomFile)'
              goals: 'spotless:check'
              options: ''
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.21'
              jdkArchitectureOption: 'x64'
              mavenVersionOption: 'Default'

      - job: UnitTests
        displayName: Run unit tests
        dependsOn: CheckCodeStyle
        condition: succeeded()
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: MavenAuthenticate@0
            displayName: Configure Maven to use Azure Artifacts
            inputs:
              artifactsFeeds: fintexincorporated

          - task: Maven@4
            displayName: Run Unit Tests
            inputs:
              mavenPomFile: '$(mavenPomFile)'
              goals: 'test'
              options: ''
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.21'
              jdkArchitectureOption: 'x64'
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              mavenVersionOption: 'Default'

  - stage: Build
    displayName: Build and Push Docker Image
    dependsOn: Validate
    condition: and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main')
      )
    jobs:
      - job: BuildDocker
        displayName: Build and Push Docker Image
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: MavenAuthenticate@0
            displayName: Configure Maven to use Azure Artifacts
            inputs:
              artifactsFeeds: fintexincorporated

          - task: Maven@4
            displayName: Maven install
            inputs:
              mavenPomFile: '$(mavenPomFile)'
              goals: 'install'
              options: '-DskipTests'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.21'
              jdkArchitectureOption: 'x64'

          - task: Maven@4
            displayName: Build Docker Image
            inputs:
              mavenPomFile: 'bootstrap/pom.xml'
              goals: 'jib:dockerBuild'
              options: >
                -Djib.from.image=mcr.microsoft.com/openjdk/jdk:21-azurelinux
                -Djib.from.auth.username=anonymous
                -Djib.to.image=crfintexfndservdevcc01.azurecr.io/calculation-engine-service:$(tag)

          - task: AzureCLI@2
            displayName: Push Docker Image
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e

                # Login to ACR
                echo "Logging into Azure Container Registry..."
                az acr login --name $(containerRegistryName)

                docker push $(containerRegistry)/$(imageRepository):$(tag)

                # Also tag as latest
                echo "Tagging as latest..."
                docker tag $(containerRegistry)/$(imageRepository):$(tag) $(containerRegistry)/$(imageRepository):latest
                docker push $(containerRegistry)/$(imageRepository):latest

                echo "✅ Docker image successfully pushed!"
                echo "Image: $(containerRegistry)/$(imageRepository):$(tag)"

  - stage: DeployInfrastructure
    displayName: Deploy Infrastructure
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployInfra
        displayName: Deploy Infrastructure
        pool:
          vmImage: ubuntu-latest
        environment: $(environment)
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureCLI@2
                  displayName: Deploy Bicep Template
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      set -e
                      
                      # Build the full managed environment ID
                      MANAGED_ENV_ID="/subscriptions/$(subscription-id)/resourceGroups/$(resourceGroupName)/providers/Microsoft.App/managedEnvironments/$(managedEnvironmentName)"
                      
                      # Get ACR admin password
                      echo "Retrieving ACR credentials..."
                      ACR_PASSWORD=$(az acr credential show --name $(containerRegistryName) --query "passwords[0].value" --output tsv)
                      ACR_USERNAME=$(az acr credential show --name $(containerRegistryName) --query "username" --output tsv)
                      
                      echo "Deploying infrastructure for: $(containerAppName)"
                      echo "Image Repository: $(imageRepository)"
                      echo "Image Tag: $(tag)"
                      echo "Managed Environment: $MANAGED_ENV_ID"
                      
                      az deployment group create \
                        --resource-group $(resourceGroupName) \
                        --template-file ./iac/main.bicep \
                        --parameters ./iac/$(environment).bicepparam \
                        --parameters containerImage="$(containerRegistry)/$(imageRepository):$(tag)" \
                        --parameters containerAppName="$(containerAppName)" \
                        --parameters managedEnvironmentId="$MANAGED_ENV_ID" \
                        --parameters containerRegistryServer="$(containerRegistry)" \
                        --parameters containerRegistryUsername="$ACR_USERNAME" \
                        --parameters containerRegistryPassword="$ACR_PASSWORD" \
                        --parameters redisPassword="$(redis-password)" \
                        --verbose
                      
                      echo "✅ Infrastructure deployment completed successfully!"

  - stage: DeployApplication
    displayName: Deploy Application
    dependsOn: DeployInfrastructure
    condition: succeeded()
    jobs:
      - deployment: DeployApp
        displayName: Deploy Application
        pool:
          vmImage: ubuntu-latest
        environment: $(environment)
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: Verify and Update Container App
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      set -e
                      
                      echo "Verifying container app deployment..."
                      
                      # Get the container app FQDN
                      FQDN=$(az containerapp show \
                        --name $(containerAppName) \
                        --resource-group $(resourceGroupName) \
                        --query "properties.configuration.ingress.fqdn" \
                        --output tsv)
                      
                      # Get running status
                      STATUS=$(az containerapp show \
                        --name $(containerAppName) \
                        --resource-group $(resourceGroupName) \
                        --query "properties.runningStatus" \
                        --output tsv)
                      
                      echo "Application deployed successfully!"
                      echo "================================================"
                      echo "Container App: $(containerAppName)"
                      echo "Status: $STATUS"
                      echo "Application URL: https://$FQDN"
                      echo "Container Image: $(containerRegistry)/$(imageRepository):$(tag)"
                      echo "================================================"
                      
                      # Wait for application to be ready
                      echo "Waiting for application to be ready..."
                      sleep 30
                      
                      # Test health endpoint
                      echo "Testing health endpoint..."
                      HEALTH_URL="https://$FQDN/actuator/health"
                      echo "Health check URL: $HEALTH_URL"
                      
                      HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
                      
                      if [ "$HTTP_STATUS" = "200" ]; then
                        echo "✅ Health check passed! Application is healthy."
                      else
                        echo "⚠️ Health check returned status: $HTTP_STATUS"
                        echo "Application might still be starting up. Check logs for details."
                      fi

                - task: AzureCLI@2
                  displayName: Display Deployment Summary
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      set -e
                      
                      echo "================================================"
                      echo "Calculation Engine Service Deployment Summary"
                      echo "================================================"
                      echo "Build ID: $(Build.BuildId)"
                      echo "Branch: $(Build.SourceBranchName)"
                      echo "Commit: $(Build.SourceVersion)"
                      echo "Environment: $(environment)"
                      echo "Resource Group: $(resourceGroupName)"
                      echo "Container App: $(containerAppName)"
                      echo "Image: $(containerRegistry)/$(imageRepository):$(tag)"
                      echo "================================================"
                      echo ""
                      echo "View logs:"
                      echo "az containerapp logs show --name $(containerAppName) --resource-group $(resourceGroupName) --follow"
                      echo ""
                      echo "View in Azure Portal:"
                      echo "https://portal.azure.com/#@/resource/subscriptions/$(subscription-id)/resourceGroups/$(resourceGroupName)/providers/Microsoft.App/containerApps/$(containerAppName)/overview"
                      echo "================================================"
